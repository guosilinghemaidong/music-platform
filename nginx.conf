# ==================== Nginx 配置 ====================
# 作用：托管 Vue 前端页面 + 反向代理后端 API
#
# 请求路由规则：
#   浏览器访问 http://localhost/          → Vue 前端页面
#   浏览器访问 http://localhost/user/...  → 转发给 FastAPI 后端
#   浏览器访问 http://localhost/music/... → 转发给 FastAPI 后端
#   ... 其他后端路由同理
#   浏览器访问 http://localhost/static/... → 转发给 FastAPI 后端（静态文件）
#
# 原理：前端请求的路径（如 /user/me）和后端路由前缀完全一致
#       Nginx 按路径前缀匹配，把对应请求原样转发给后端容器

server {
    listen 80;
    server_name localhost;

    # ---------- 后端 API 反向代理 ----------
    # 所有后端路由前缀 → 转发给后端容器（请求路径不变）
    # proxy_pass 末尾不带斜杠 = 保留原始路径
    location /user/       { proxy_pass http://backend:8000; }
    location /music/      { proxy_pass http://backend:8000; }
    location /singer/     { proxy_pass http://backend:8000; }
    location /album/      { proxy_pass http://backend:8000; }
    location /category/   { proxy_pass http://backend:8000; }
    location /collection/ { proxy_pass http://backend:8000; }
    location /like/       { proxy_pass http://backend:8000; }
    location /follow/     { proxy_pass http://backend:8000; }
    location /comment/    { proxy_pass http://backend:8000; }
    location /post/       { proxy_pass http://backend:8000; }
    location /admin/      { proxy_pass http://backend:8000; }
    location /upload/     { proxy_pass http://backend:8000; }
    location /static/     { proxy_pass http://backend:8000; }
    location /health      { proxy_pass http://backend:8000; }
    location /test-redis  { proxy_pass http://backend:8000; }

    # 所有代理请求都带上这些头信息（让后端知道真实客户端 IP）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- Vue 前端静态文件 ----------
    # 不匹配后端路径的请求 → 全部当作前端页面处理
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Vue Router history 模式：刷新页面时回退到 index.html
        # 否则刷新 /discover 这种前端路由会返回 404
        try_files $uri $uri/ /index.html;
    }
}
