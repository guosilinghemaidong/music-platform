# ==================== Docker Compose 编排文件 ====================
# 作用：一条命令启动所有容器（后端 + 前端 + MySQL + Redis）
# 使用方法：在项目根目录执行 docker compose up -d
#
# 整体架构：
#   浏览器 → frontend(:80) → Vue 页面
#                          → /api/* → backend(:8000)
#                          → /static/* → backend(:8000)
#   backend(:8000) → db(:3306) MySQL
#                  → redis(:6379) Redis

# version 字段在新版 Docker Compose 中可以省略（V2 默认使用最新格式）

services:

  # ==================== MySQL 数据库 ====================
  db:
    image: mysql:8.0               # 使用 MySQL 8.0 官方镜像
    container_name: music_db       # 容器名称（方便辨认）
    restart: always                # 异常退出后自动重启
    environment:
      MYSQL_ROOT_PASSWORD: root123456   # root 密码
      MYSQL_DATABASE: music_platform    # 自动创建这个数据库
      MYSQL_CHARSET: utf8mb4           # 字符集（支持 emoji）
    ports:
      - "3306:3306"                # 宿主机端口:容器端口（方便本地用 Navicat 等工具连接）
    volumes:
      - mysql_data:/var/lib/mysql  # 数据持久化（容器删了数据不丢）
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine          # Redis 7 Alpine 版（体积小）
    container_name: music_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data           # 数据持久化

  # ==================== FastAPI 后端 ====================
  backend:
    build:
      context: .                   # 构建上下文：项目根目录（COPY 路径以此为基准）
      dockerfile: Dockerfile/Dockerfile.backend
    container_name: music_backend
    restart: always
    ports:
      - "8000:8000"                # 开发时可以直接访问后端
    environment:
      # 关键！这里用容器名代替 localhost
      # Docker 内部网络中，容器之间通过容器名互相访问
      DATABASE_URL: mysql+aiomysql://root:root123456@db:3306/music_platform?charset=utf8mb4
      REDIS_HOST: redis            # redis 是上面 redis 服务的容器名
      REDIS_PORT: 6379
      SECRET_KEY: your-secret-key-change-later
    depends_on:
      - db                         # 等 MySQL 启动后再启动后端
      - redis                      # 等 Redis 启动后再启动后端
    volumes:
      - ./static:/app/static       # 挂载静态文件目录（上传的文件持久化）

  # ==================== Vue3 前端（Nginx 托管）====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile.frontend
    container_name: music_frontend
    restart: always
    ports:
      - "80:80"                    # 浏览器通过 http://localhost 访问
    depends_on:
      - backend                    # 等后端启动后再启动前端

# ==================== 数据卷（持久化存储）====================
# 容器删除后，数据卷里的数据不会丢失
volumes:
  mysql_data:    # MySQL 数据
  redis_data:    # Redis 数据
